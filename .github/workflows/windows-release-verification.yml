name: Windows release verification

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'

permissions:
  contents: read

jobs:
  release-build-and-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/ScriptSyncPilot.slnx

      - name: Build Release
        run: dotnet build src/ScriptSyncPilot.slnx --configuration Release --no-restore --verbosity minimal

      - name: Run automated tests
        run: dotnet test src/ScriptSyncPilot.slnx --configuration Release --no-build --no-restore --blame-hang-timeout 2m --verbosity minimal
